name: Testy regresji
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Przygotuj testy
        run: cmake -S tests -B build-tests -DENABLE_SANITIZERS=${{ runner.os != 'Windows' && 'ON' || 'OFF' }}
      - name: Zbuduj testy
        run: cmake --build build-tests --config Debug
      - name: Uruchom testy
        run: ctest --test-dir build-tests -C Debug --output-on-failure
