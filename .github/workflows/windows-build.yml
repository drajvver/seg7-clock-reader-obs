name: Budowanie i wydanie dla Windows
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "*"
permissions:
  contents: write
jobs:
  windows-build:
    name: Budowanie dla Windows
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Zbuduj wtyczkę
        uses: ./.github/actions/build-plugin
        with:
          target: x64
          config: RelWithDebInfo

      - name: Przygotuj paczkę
        uses: ./.github/actions/package-plugin
        with:
          target: x64
          config: RelWithDebInfo
          package: true

      - name: Udostępnij paczkę
        uses: actions/upload-artifact@v4
        with:
          name: seg7-clock-reader-windows-x64
          path: release/*.zip
          if-no-files-found: error

      - name: Opublikuj wydanie
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zip = (Get-ChildItem release/*.zip | Select-Object -First 1).FullName
          $notes = @"
          Czytnik zegara 7-segmentowego do OBS Studio (Windows x64).

          Instalacja: zamknij OBS i rozpakuj pobrany plik. Skopiuj cały folder
          ``seg7-clock-reader`` do ``%APPDATA%\obs-studio\plugins\``.
          Jeśli folder ``plugins`` nie istnieje, utwórz go. Następnie uruchom OBS.

          Pierwsze uruchomienie: dodaj źródło Tekst (GDI+) lub Tekst (FreeType 2).
          Do źródła z filmem lub kamerą dodaj filtr „Czytnik zegara 7-segmentowego”.
          Wybierz źródło tekstu i kliknij „Zaznacz zegar na obrazie…”.
          Zaznacz całe minuty i sekundy z dwukropkiem, np. 1:23.

          Wymagany OBS Studio 32.x (64-bitowy).
          Instrukcja: https://github.com/drajvver/seg7-clock-reader-obs#readme
          "@
          $version = $tag -replace '^v', ''
          $versionNotes = Join-Path '.github/release-notes' "$version.md"
          if (Test-Path $versionNotes) {
            $notesFile = (Resolve-Path $versionNotes).Path
          } else {
            $notesFile = Join-Path $env:RUNNER_TEMP 'seg7-release-notes.md'
            Set-Content -Path $notesFile -Value $notes -Encoding utf8
          }
          gh release create $tag $zip --title "Czytnik zegara 7-segmentowego $tag" --notes-file $notesFile --verify-tag
          if ($LASTEXITCODE -ne 0) {
            gh release upload $tag $zip --clobber
          }
