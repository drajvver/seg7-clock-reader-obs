name: Budowanie i wydanie dla Windows
# Windows runners are expensive: build only when a release is published.
# "Run workflow" in the Actions tab still allows a manual test build of any
# branch (the zip is then only attached to the run as an artifact).
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-build:
    name: Budowanie dla Windows
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Zbuduj wtyczkę
        uses: ./.github/actions/build-plugin
        with:
          target: x64
          config: RelWithDebInfo

      - name: Przygotuj paczkę
        uses: ./.github/actions/package-plugin
        with:
          target: x64
          config: RelWithDebInfo
          package: true

      - name: Udostępnij paczkę
        uses: actions/upload-artifact@v4
        with:
          name: seg7-clock-reader-windows-x64
          path: release/*.zip
          if-no-files-found: error

      - name: Dołącz paczkę do wydania
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          $tag = $env:RELEASE_TAG
          $zip = (Get-ChildItem release/*.zip | Select-Object -First 1).FullName
          $notes = @"
          Czytnik zegara 7-segmentowego do OBS Studio (Windows x64).

          Instalacja: zamknij OBS i rozpakuj pobrany plik. Skopiuj cały folder
          ``seg7-clock-reader`` do ``%APPDATA%\obs-studio\plugins\``.
          Jeśli folder ``plugins`` nie istnieje, utwórz go. Następnie uruchom OBS.

          Pierwsze uruchomienie: dodaj źródło Tekst (GDI+) lub Tekst (FreeType 2).
          Do źródła z filmem lub kamerą dodaj filtr „Czytnik zegara 7-segmentowego (Futsal)”
          albo „Czytnik zegara 7-segmentowego (Kosz)” dla tablicy koszykarskiej.
          Wybierz źródło tekstu i kliknij „Zaznacz zegar na obrazie…”.
          Zaznacz całe minuty i sekundy z dwukropkiem, np. 1:23.

          Wymagany OBS Studio 32.x (64-bitowy).
          Instrukcja: https://github.com/drajvver/seg7-clock-reader-obs#readme
          "@
          $version = $tag -replace '^v', ''
          $versionNotes = Join-Path '.github/release-notes' "$version.md"
          if (Test-Path $versionNotes) {
            $notesFile = (Resolve-Path $versionNotes).Path
          } else {
            $notesFile = Join-Path $env:RUNNER_TEMP 'seg7-release-notes.md'
            Set-Content -Path $notesFile -Value $notes -Encoding utf8
          }
          gh release upload $tag $zip --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Keep notes written in the release; fill them in only when left empty.
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_BODY)) {
            gh release edit $tag --notes-file $notesFile
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
