name: Pull Request
run-name: ${{ github.event.pull_request.title }} pull request run 🚀
# Manual only (Actions → Run workflow): a compile check on Windows, macOS and
# Linux without packaging. Not started for pull requests, because Windows
# runners are expensive; tests.yml covers the automatic checks.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true
jobs:
  check-format:
    name: Check Formatting 🔍
    uses: ./.github/workflows/check-format.yaml
    permissions:
      contents: read

  build-project:
    name: Build Project 🧱
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit
    permissions:
      contents: read
